spring.application.name=emergency-dashboard
server.port=${PORT:8081}

# ── DATABASE ──────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────
jwt.secret=${JWT_SECRET:emergex-super-secret-key-change-this-in-production-min-32-chars}
jwt.expiration.ms=86400000

# ── TWILIO SMS ────────────────────────────────────────
twilio.enabled=false
twilio.account.sid=${TWILIO_ACCOUNT_SID:placeholder}
twilio.auth.token=${TWILIO_AUTH_TOKEN:placeholder}
twilio.phone.number=${TWILIO_PHONE_NUMBER:placeholder}

# ── GROQ AI CLASSIFICATION ────────────────────────────
groq.api.key=${GROQ_API_KEY}